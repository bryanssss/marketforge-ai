name: Dependency audit

on:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install audit tool
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit declared application dependencies
        run: pip-audit --requirement requirements.txt --progress-spinner off --desc on
