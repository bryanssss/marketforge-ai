name: Frozen benchmark smoke checks

on:
  push:
    paths:
      - "app/benchmark/**"
      - "benchmarks/frozen_v2/**"
      - "scripts/benchmark.py"
      - "tests/test_benchmark_*.py"
      - ".github/workflows/benchmark-smoke.yml"
  pull_request:
    paths:
      - "app/benchmark/**"
      - "benchmarks/frozen_v2/**"
      - "scripts/benchmark.py"
      - "tests/test_benchmark_*.py"
      - ".github/workflows/benchmark-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Validate frozen specification and statistical engine
        run: pytest -q tests/test_benchmark_statistics.py tests/test_benchmark_spec_data.py tests/test_benchmark_runner_report.py
      - name: Confirm lock files are valid JSON
        run: |
          python -m json.tool benchmarks/frozen_v2/spec.json >/dev/null
          python -m json.tool benchmarks/frozen_v2/model_lock.json >/dev/null
          python -m json.tool benchmarks/frozen_v2/data_lock.json >/dev/null
          python -m json.tool benchmarks/frozen_v2/preregistration_lock.json >/dev/null
      - name: Verify prospective seal
        run: python scripts/benchmark.py status
