name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app tests scripts run.py
      - name: Lint critical production errors
        if: matrix.python-version == '3.13'
        run: ruff check app run.py --select E9,F63,F7,F82
      - name: Test with coverage
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=78
      - name: Validate browser JavaScript
        if: matrix.python-version == '3.13'
        run: node --check app/static/app.js
