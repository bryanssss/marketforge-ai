[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "marketforge-ai"
version = "0.4.0"
description = "Evidence-aware market data validation, forecasting and walk-forward research studio."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [{name = "MarketForge AI contributors"}]
keywords = ["forecasting", "backtesting", "financial-data", "kronos", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "fastapi>=0.139.2,<1.0",
  "uvicorn[standard]>=0.51.0,<1.0",
  "python-multipart>=0.0.32,<1.0",
  "pandas>=2.3.1,<3.0",
  "numpy>=2.2.6,<3.0",
  "pydantic>=2.13.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1.0",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pandas-stubs>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/bryanssss/marketforge-ai"
Issues = "https://github.com/bryanssss/marketforge-ai/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
exclude = "vendor/"
